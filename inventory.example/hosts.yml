# Example inventory. Copy this directory to ./inventory (gitignored), or clone your own
# private inventory repository there, then edit the values. ansible.cfg uses ./inventory/hosts.yml.
#
# Precedence: everything set here or in group_vars/ overrides roles/repo_defaults.

webservers:
  hosts:
    203.0.113.20:                 # your server's public IP or hostname
  vars:
    ansible_user: root
    ansible_connection: ssh
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
