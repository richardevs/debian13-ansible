    # Per-server security headers + shared locations.
    # Must be server-level: a location- or HSTS-level add_header drops these.

    add_header "X-Frame-Options" "SAMEORIGIN" always;
    add_header "X-Content-Type-Options" "nosniff" always;
    add_header "Referrer-Policy" "strict-origin-when-cross-origin" always;
    add_header "Permissions-Policy" "geolocation=(), camera=(), microphone=()" always;
    add_header "X-XSS-Protection" "0" always;
    # COOP/COEP/CORP omitted (break WP embeds); add per-site if needed.

    # Per-IP request rate cap: burst absorbs page-load spikes, sustained >15r/s → 503.
    limit_req zone=req_per_ip burst=100 nodelay;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    # Deny dotfiles except /.well-known/.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(sql|bak|old|orig|save|swp|swo|tmp)$ {
        deny all;
        access_log off;
    }
