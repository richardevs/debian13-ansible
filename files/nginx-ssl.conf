    # generated 2026-09-08, TLSRef Guideline v6.0, intermediate config, HSTS, no OCSP
    # https://configurator.tlsref.org/#server=nginx&config=intermediate&hsts&guideline=6.0

    http2 on;

    ssl_protocols TLSv1.2 TLSv1.3;
    # X25519MLKEM768 = post-quantum hybrid KEX (needs OpenSSL 3.5+)
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
