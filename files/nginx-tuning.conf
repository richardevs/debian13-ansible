# nginx http-context tuning (conf.d).

client_max_body_size 20m;

# Per-IP request-rate flood guard; applied at server level in nginx-common.conf,
# banned on repeat by the nginx-limit-req fail2ban jail.
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=15r/s;

gzip  on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;

gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;
