; PHP-FPM hardening (conf.d, loaded after php.ini).
; move_uploaded_file/mkdir/chmod/rename stay enabled for WordPress.

expose_php = Off
allow_url_fopen = Off
cgi.fix_pathinfo = 0

disable_functions = system, exec, shell_exec, passthru, phpinfo, proc_open, show_source, highlight_file, popen, fopen_with_path, dbmopen, dbase_open, putenv, chdir, filepro, filepro_rowcount, filepro_retrieve, posix_mkfifo

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.upload_progress.enabled = 0
